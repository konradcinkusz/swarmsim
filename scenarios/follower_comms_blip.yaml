version: 1
name: follower_comms_blip
description: >
  drone_3 loses contact with the rest of the swarm for 3 s in the middle of a line
  formation — shorter than the 5 s comms timeout. It must hold its slot, pick the leader
  up again when contact returns and finish the mission, never giving up and flying home.
drones: 3
duration_s: 90
events:
  - at_s: 1
    mission:
      type: formation
      formation: line
      waypoints: [[0, 0, 6], [60, 0, 6]]
      drone_count: 3
      spacing_m: 3
  - at_s: 25
    comms_loss: {drones: [drone_3], duration_s: 3}
assertions:
  - never_mode: {drone: drone_3, mode: AUTO.RTL}
  - formation_error: {max_m: 2.5, from_s: 40}
  - min_separation: {min_m: 1.5}
  - mission_completes: {within_s: 85}
