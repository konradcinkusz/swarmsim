name: swarmsim

# The development composition root for the simulation stack (docs/adr/0002). Headless by
# default: no GPU, no display, nothing on the host but Docker. For the Gazebo GUI, add
# the override: `docker compose -f docker-compose.yml -f docker-compose.gui.yml up`.
# Every variable below is optional — see .env.example next to this file.

services:
  sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sim
    image: swarmsim/sim:local
    environment:
      # 1 (default): Gazebo server only — runs anywhere. 0: also start the Gazebo GUI,
      # which needs the X11/GPU wiring in docker-compose.gui.yml.
      - HEADLESS=${HEADLESS:-1}
      # Spawn only the first N of simulation/px4-configs/drone_*.env (empty: all of them).
      - SWARM_DRONE_COUNT=${SWARM_DRONE_COUNT:-}
    ports:
      # rosbridge WebSocket — what SwarmApi.Infrastructure's RosBridgeSwarmBridge
      # connects to (RosBridge__Url=ws://localhost:9090 from the host).
      #
      # PX4's MAVLink ports are deliberately NOT published: PX4 SITL sends MAVLink to
      # the container's own localhost (UDP 14540+instance for offboard, 14550 for a
      # GCS), so a mapping to the host never carried any traffic. Consoles are reached
      # with `docker compose exec sim tmux attach -t drone_<n>` instead.
      - "9090:9090"
    healthcheck:
      # Healthy = rosbridge accepts connections, which is what SwarmApi.Api needs before
      # it decides Connected vs Simulated (docs/adr/0003). The generous start period
      # covers Gazebo and PX4 coming up on a cold container.
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/9090"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 180s
    networks:
      - swarmsim-net

  api:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.api
    image: swarmsim/api:local
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Container-to-container DNS name; unset entirely (or unreachable) and the API
      # degrades to the in-memory simulated bridge instead of failing to start — see
      # docs/adr/0003-rosbridge-degrade-pattern.md.
      - RosBridge__Url=ws://sim:9090
      # Unset (default) keeps SwarmApi.Api in Open auth mode — no token needed anywhere.
      # Run with `--profile auth` and set SWARM_AUTH_AUTHORITY=http://authservice:8080
      # plus SWARM_AUTH_REQUIRE_HTTPS_METADATA=false (authservice serves plain http inside
      # this network) to require a bearer token on POST /api/missions instead — see
      # docs/adr/0005-mcp-server-and-bearer-auth.md.
      - Auth__Authority=${SWARM_AUTH_AUTHORITY:-}
      - Auth__Audience=SwarmApi
      - Auth__RequireHttpsMetadata=${SWARM_AUTH_REQUIRE_HTTPS_METADATA:-true}
    ports:
      - "8080:8080"
    depends_on:
      # Wait for rosbridge rather than merely for the container to exist: the API picks
      # its bridge once at startup, and started too early it settles on Simulated.
      sim:
        condition: service_healthy
    networks:
      - swarmsim-net

  # Both services below only start with `docker compose --profile auth up` (or
  # COMPOSE_PROFILES=auth) — opt-in, so the default `docker compose up` quickstart
  # gains no new build step and no new network dependency. See
  # docs/adr/0005-mcp-server-and-bearer-auth.md.
  authservice-db:
    image: postgres:16-alpine
    profiles:
      - auth
    environment:
      POSTGRES_DB: authservice
      POSTGRES_USER: postgres
      # Local-only throwaway database inside this compose network; never published.
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - swarmsim-net

  authservice:
    profiles:
      - auth
    # No ghcr.io/konradcinkusz/authservice tag has been published yet (no v* release
    # has been tagged in that repository at the time of writing) — build from its git
    # context as an interim measure. Swap to
    # `image: ghcr.io/konradcinkusz/authservice:vX.Y.Z` once one exists (see that
    # repo's README, "Releasing").
    build:
      context: https://github.com/konradcinkusz/authservice.git
      dockerfile: src/AuthService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DatabaseProvider=PostgreSQL
      - ConnectionStrings__DefaultConnection=Host=authservice-db;Port=5432;Database=authservice;Username=postgres;Password=postgres
      # RS256, not authservice's own HS256 zero-ceremony default: SwarmApi.Api is a
      # second service validating these tokens the moment this profile is used, and
      # that is exactly the case authservice's own README says RS256 is for. Generate
      # your own key first — never commit it:
      #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt-signing.pem
      #   export AUTHSERVICE_JWT_PRIVATE_KEY_PEM="$(cat jwt-signing.pem)"
      - Jwt__Algorithm=RS256
      - Jwt__PrivateKeyPem=${AUTHSERVICE_JWT_PRIVATE_KEY_PEM:-}
      - Jwt__Issuer=AuthService
      - Jwt__Audience=SwarmApi
      - Cors__AllowedOrigins__0=http://localhost:8080
    ports:
      - "8081:8080"
    depends_on:
      authservice-db:
        condition: service_healthy
    networks:
      - swarmsim-net

networks:
  swarmsim-net:
    driver: bridge
