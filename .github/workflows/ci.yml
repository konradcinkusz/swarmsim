name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # architecture-standards P2: the shared kernel's ceiling is mechanical, not advisory
      # (~800 lines, checked in CI). ArchitectureTests asserts the other half — no
      # entity, DTO or enum in it.
      - name: Shared kernel size ceiling (P2)
        run: |
          lines=$(cat backend/src/SwarmApi.ServiceDefaults/*.cs | wc -l)
          echo "SwarmApi.ServiceDefaults: ${lines} lines (ceiling 800)"
          test "${lines}" -le 800

      - name: Restore
        run: dotnet restore backend/SwarmPlatform.sln

      - name: Build
        run: dotnet build backend/SwarmPlatform.sln --no-restore -c Release

      - name: Test
        run: >
          dotnet test backend/SwarmPlatform.sln --no-build -c Release
          --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: TestResults

  python:
    name: Python lint & test (swarm_coordination)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swarm_coordination
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # jsonschema and pyyaml are for the contract and scenario tests, which skip without
      # them — something CI must never do. The ROS nodes need neither.
      - name: Install dependencies
        run: pip install ruff pytest jsonschema pyyaml

      - name: ruff check
        run: ruff check .

      - name: pytest
        run: pytest -v

  scenarios:
    name: Swarm scenarios (L0, 3 seeds, mutation check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The repository's own scenario action, run the way a caller runs it — so the suite
      # and the action are checked together, on both of their outcomes.
      - name: Scenario suite (must pass)
        id: suite
        uses: ./
        with:
          scenarios: scenarios
          seeds: "3"
          mutation-check: "true"
          junit-path: scenario-results.xml

      - name: A failing scenario (must fail)
        id: failing
        continue-on-error: true
        uses: ./
        with:
          scenarios: swarm_coordination/test/fixtures/scenarios
          seeds: "1"
          junit-path: failing-scenario-results.xml
          job-summary: "false"

      - name: The action passed the suite and failed the failing scenario
        env:
          SUITE_PASSED: ${{ steps.suite.outputs.passed }}
          FAILING_OUTCOME: ${{ steps.failing.outcome }}
          FAILING_PASSED: ${{ steps.failing.outputs.passed }}
        run: |
          test "$SUITE_PASSED" = "true"
          test "$FAILING_OUTCOME" = "failure" \
            || { echo "::error::the scenario action passed a scenario that must fail"; exit 1; }
          test "$FAILING_PASSED" = "false"
          grep -q 'failures="1"' failing-scenario-results.xml

      - name: Upload scenario reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-results
          path: "*scenario-results.xml"

  mission-smoke-action:
    name: Mission smoke action (against a local API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Start SwarmApi.Api (simulated swarm, Open auth)
        run: |
          dotnet run --project backend/src/SwarmApi.Api --urls http://127.0.0.1:5080 > api.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:5080/alive >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat api.log
          exit 1

      - name: A valid mission (must pass)
        uses: ./actions/mission-smoke
        with:
          api-url: http://127.0.0.1:5080
          mission-json: >-
            {"name":"CI smoke","type":"waypoint","waypoints":[{"x":0,"y":0,"z":5},{"x":10,"y":0,"z":5}],"droneCount":2,"spacingMeters":3}
          poll-attempts: "3"
          poll-interval-seconds: "1"

      - name: A mission outside the safety envelope (must fail)
        id: rejected
        continue-on-error: true
        uses: ./actions/mission-smoke
        with:
          api-url: http://127.0.0.1:5080
          mission-json: >-
            {"name":"Too many","type":"waypoint","waypoints":[{"x":0,"y":0,"z":5}],"droneCount":99,"spacingMeters":3}
          poll-attempts: "1"

      - name: The action failed the rejected mission
        env:
          OUTCOME: ${{ steps.rejected.outcome }}
        run: test "$OUTCOME" = "failure" || { echo "::error::the mission smoke action passed a mission the API rejects"; exit 1; }

  mcp-server:
    name: Python lint & test (mcp_server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ruff pytest

      - name: ruff check
        run: ruff check .

      - name: pytest
        run: pytest -v

  e2e:
    name: Dashboard end-to-end (Playwright, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Pinned to the version the suite was written against; `install --with-deps`
      # fetches the Chromium build that version expects, and its system libraries.
      - name: Install Playwright and Chromium
        run: |
          pip install "playwright==1.63.0" pytest
          python -m playwright install --with-deps chromium

      # Built here so a compile error fails this step, not the fixture's 180 s startup wait.
      - name: Build SwarmApi.Api
        run: dotnet build backend/src/SwarmApi.Api

      - name: Dashboard flows (starts the API with the simulated swarm, Open auth)
        run: pytest e2e -v

      - name: API log
        if: failure()
        run: cat e2e/api.log || true

  docker-lint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: hadolint — Dockerfile.sim
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/Dockerfile.sim
          config: .hadolint.yaml

      - name: hadolint — Dockerfile.api
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/Dockerfile.api
          config: .hadolint.yaml

  simulation-config:
    name: Simulation config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose config
        run: docker compose -f docker/docker-compose.yml config -q

      - name: Validate docker-compose config (auth profile)
        run: docker compose -f docker/docker-compose.yml --profile auth config -q

      - name: Validate docker-compose config (GUI override)
        run: DISPLAY=:0 docker compose -f docker/docker-compose.yml -f docker/docker-compose.gui.yml config -q

      - name: Validate Gazebo world SDF/XML well-formedness
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libxml2-utils
          find simulation -name '*.sdf' -print0 | xargs -0 -n1 xmllint --noout

      # The sim image is not built here (docs/adr/0004), so nothing else would notice if
      # the per-drone configs went missing again — which is exactly what happened when a
      # blanket `*.env` ignore rule kept them out of the repository.
      - name: PX4 drone configs are present
        run: |
          test -f simulation/px4-configs/x500_common.env
          test -f simulation/px4-configs/px4-rc.params
          ls simulation/px4-configs/drone_*.env
          for world in simulation/worlds/*.sdf; do
            name=$(sed -n 's/.*<world name="\([^"]*\)".*/\1/p' "$world")
            test "$(basename "$world" .sdf)" = "$name" \
              || { echo "::error file=$world::world name '$name' must match the file name"; exit 1; }
          done

      - name: Shell scripts (shellcheck) and entrypoint logic (stubbed)
        run: |
          shellcheck docker/entrypoint.sh docker/tests/test_entrypoint.sh docker/tests/px4_state.sh \
            docker/tests/px4_sensor_stall.sh backend/docker-entrypoint.sh \
            scripts/*.sh scripts/hooks/pre-commit
          shellcheck -s sh simulation/px4-configs/px4-rc.params
          bash docker/tests/test_entrypoint.sh

  docs:
    name: Docs site build (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Build (fails on any broken internal link/nav entry)
        run: mkdocs build --strict

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 is load-bearing: the scan below reads git history, and a
          # shallow clone would let a secret added and then removed in an earlier
          # commit pass — the case this job exists to catch, since it is still in
          # history. (The job used to pass --no-git, which scanned only the working
          # tree and made this full fetch pointless.)
          fetch-depth: 0

      # Same scanner, image and invocation as architecture-standards'
      # .github/workflows/secret-scan.yml and this repo's scripts/scan-secrets.sh, so a
      # clean local run means a clean CI run. The image is :latest deliberately, per that
      # workflow's reasoning: a pinned ruleset silently stops detecting whatever upstream
      # added last month.
      - name: Scan full git history
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/gitleaks/gitleaks:latest"
          # gitleaks renamed `detect` to `git` in v8.19; probe instead of assuming.
          if docker run --rm "$IMAGE" git --help >/dev/null 2>&1; then
            SUB=(git /repo)
          else
            SUB=(detect --source=/repo)
          fi
          docker run --rm -v "$PWD:/repo" -w /repo "$IMAGE" "${SUB[@]}" \
            --config=/repo/.gitleaks.toml --redact --no-banner --verbose --exit-code 1

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "## Secret scan failed"
            echo
            echo "A credential-shaped string was found in this repository's history."
            echo "**This repository is public**, so the order is not negotiable:"
            echo
            echo "1. **Rotate the credential.** Now, before anything else."
            echo "2. Remove it from the source; read it from the environment instead."
            echo "3. Only then clean history."
            echo
            echo "A false positive gets a **narrow** allowlist entry in \`.gitleaks.toml\`,"
            echo "with a comment saying why. Reproduce locally: \`./scripts/scan-secrets.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"
