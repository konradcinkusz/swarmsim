name: SITL smoke

# Builds the simulation image and flies the swarm — PX4 SITL, Gazebo (headless, CPU
# only), ROS 2 + MAVROS, rosbridge and SwarmApi.Api — through docker/tests/sitl_smoke.py.
# It is the only automated evidence for M0/M1, and for M3 against the real stack (see
# docs/adr/0004 and its 2026-09-22 amendment). A cold build takes most of an hour, so it
# runs on pull requests that touch what the image or the API is built from, nightly, and
# on demand; the image's layers are cached in GHCR between runs.
on:
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "simulation/**"
      - "swarm_coordination/**"
      - "contracts/**"
      - "backend/src/**"
      - ".github/workflows/sim-smoke.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sim-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_REF: ghcr.io/${{ github.repository_owner }}/swarmsim-sim-cache:buildcache
  # Pull requests from forks get no registry credentials: they read the cache, never write it.
  CAN_WRITE_CACHE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  DRONES: 3

jobs:
  sitl:
    name: SITL smoke (3 drones, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      # PX4's toolchain, Gazebo Harmonic and the build tree need well over the ~14 GB a
      # runner starts with free; these preinstalled SDKs are never used here.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (layer cache)
        if: env.CAN_WRITE_CACHE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the simulation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.sim
          tags: swarmsim/sim:local
          load: true
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: ${{ env.CAN_WRITE_CACHE == 'true' && format('type=registry,ref={0},mode=max', env.CACHE_REF) || '' }}

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: docker/Dockerfile.api
          tags: swarmsim/api:local
          load: true
          cache-from: type=gha,scope=swarmsim-api
          cache-to: type=gha,scope=swarmsim-api,mode=max

      - name: Start the stack (3 drones, headless)
        working-directory: docker
        run: |
          df -h /
          SWARM_DRONE_COUNT="${DRONES}" docker compose up -d --no-build

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The verdict is the last step: a failed flight is first checked for PX4's own
      # simulated-sensor stall, the one fault that gets a second flight (docs/adr/0004,
      # 2026-09-23). Any other failure fails the job.
      - name: Fly the swarm
        id: fly
        continue-on-error: true
        run: >
          python3 docker/tests/sitl_smoke.py --api http://localhost:8080 --drones "${DRONES}"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Check a failed flight for PX4's simulated-sensor stall
        id: stall
        if: steps.fly.outcome == 'failure'
        working-directory: docker
        run: |
          docker compose exec -T sim bash -s -- "${DRONES}" < tests/px4_sensor_stall.sh \
            | tee ../stall.txt
          if grep -q '^stalled ' ../stall.txt; then
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=PX4 SITL fault::$(head -n 1 ../stall.txt). Flying once more on a fresh stack (docs/adr/0004)."
            {
              echo ""
              echo "**The flight above failed on PX4's simulated-sensor stall** ($(head -n 1 ../stall.txt))."
              echo "PX4-Autopilot#23130; see docs/adr/0004. The stack is restarted and flown once more:"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restart the stack and fly once more
        id: retry
        if: steps.stall.outputs.retry == 'true'
        working-directory: docker
        run: |
          # The first flight's evidence, before its containers go.
          mkdir -p ../sitl-logs/first-flight
          docker compose logs --no-color > ../sitl-logs/first-flight/compose.log 2>&1 || true
          docker compose exec -T sim bash -s -- "${DRONES}" < tests/px4_state.sh \
            > ../sitl-logs/first-flight/px4-state.txt 2>&1 || true
          docker compose down --timeout 30
          SWARM_DRONE_COUNT="${DRONES}" docker compose up -d --no-build
          cd .. && python3 docker/tests/sitl_smoke.py --api http://localhost:8080 \
            --drones "${DRONES}" --summary "$GITHUB_STEP_SUMMARY"

      - name: Collect logs
        if: always()
        working-directory: docker
        run: |
          mkdir -p ../sitl-logs
          docker compose ps -a > ../sitl-logs/ps.txt 2>&1 || true
          docker compose logs --no-color > ../sitl-logs/compose.log 2>&1 || true
          docker compose cp sim:/tmp/swarmsim ../sitl-logs/sim 2>/dev/null || true
          tail -n 80 ../sitl-logs/compose.log || true
          # What each PX4 instance believes about itself, and the end of its console — in
          # the job log as well as the artifact, so a failed run can be read without it.
          docker compose exec -T sim bash -s -- "${DRONES}" < tests/px4_state.sh \
            > ../sitl-logs/px4-state.txt 2>&1 || true
          cat ../sitl-logs/px4-state.txt
          for log in ../sitl-logs/sim/drone_*.log; do
            [ -f "$log" ] || continue
            echo "=== ${log#../sitl-logs/} (last 40 lines)"
            tail -n 40 "$log" | sed 's/\x1b\[[0-9;?]*[A-Za-z]//g'
          done
          # The ROS side: what each controller asked PX4 for, and what PX4 refused. MAVROS
          # relays every PX4 health event as an "FCU:" line; they would bury the rest.
          if [ -f ../sitl-logs/sim/coordination.log ]; then
            echo "=== sim/coordination.log without MAVROS's FCU relays (last 200 lines)"
            grep -v 'FCU: ' ../sitl-logs/sim/coordination.log | tail -n 200 | sed 's/\x1b\[[0-9;?]*[A-Za-z]//g'
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sitl-logs
          path: sitl-logs
          if-no-files-found: ignore

      - name: Verdict
        if: always()
        env:
          FLIGHT: ${{ steps.fly.outcome }}
          SECOND_FLIGHT: ${{ steps.retry.outcome }}
        run: |
          case "${FLIGHT}/${SECOND_FLIGHT}" in
            success/*) echo "The swarm flew." ;;
            failure/success)
              echo "::warning::The swarm flew on the second flight, after PX4's simulated-sensor stall on the first." ;;
            *)
              echo "::error::The SITL flight failed (first: ${FLIGHT}, second: ${SECOND_FLIGHT:-not flown})."
              exit 1 ;;
          esac
