[project]
name = "mcp-server-swarmsim"
version = "0.1.0"
description = "MCP server exposing swarm-level tools over SwarmApi.Api's REST surface, behind a human approval gate for anything that flies."
requires-python = ">=3.10"
# mcp 2.x renamed FastMCP to MCPServer; the 1.x API this server was first written against
# would not even import under a fresh `pip install` of the old ">=1.2.0" range.
dependencies = ["mcp>=2.2,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_server*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["test"]
